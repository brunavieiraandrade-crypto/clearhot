<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estúdio de Cílios | Especialistas em Extensão</title>
  <style>
    :root {
      --primary-color: #d4a373; 
      --secondary-color: #faedcd; 
      --accent-color: #bc6c25;
      --text-color: #333333;
      --whatsapp-color: #25D366;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fdfbf7;
      color: var(--text-color);
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    header {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 3rem 1rem;
      background-image: linear-gradient(rgba(212, 163, 115, 0.9), rgba(212, 163, 115, 0.9)), url('https://images.unsplash.com/photo-1512413914568-150280eb4c71?w=1200&q=80');
      background-size: cover;
      background-position: center;
    }

    header h1 {
      margin: 0;
      font-size: 2.8rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    section {
      margin-bottom: 4rem;
    }

    h2 {
      text-align: center;
      color: var(--accent-color);
      border-bottom: 2px solid var(--secondary-color);
      padding-bottom: 0.5rem;
      margin-bottom: 2rem;
      font-size: 2rem;
    }

    /* Grid para as técnicas */
    .techniques-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 2rem;
    }

    .technique-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border: 1px solid var(--secondary-color);
      transition: transform 0.3s ease;
    }

    .technique-card:hover {
      transform: translateY(-5px);
    }

    .technique-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .technique-content {
      padding: 1.5rem;
    }
